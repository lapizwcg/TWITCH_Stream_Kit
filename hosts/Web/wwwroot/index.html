<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream Kit — оповещения</title>
<script type="importmap"></script>
<!-- САМООБНОВЛЕНИЕ: GitHub Pages разрешает кэш до 10 минут, а браузер OBS держит страницы и дольше — после выкладки работала бы
     старая версия. Номер версии вписывает tools/deploy.py (здесь и в version.json); отстали — перезагружаемся по новому адресу,
     которого нет в кэше. Локально (номер не вписан) — ничего не делаем -->
<script>
(function () {
  var CURRENT = '__KIT_VERSION__';
  if (CURRENT.indexOf('__') === 0) return;
  fetch('version.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.v || j.v === CURRENT || sessionStorage.getItem('kit.updatedTo') === j.v) return;
      sessionStorage.setItem('kit.updatedTo', j.v);
      var u = new URL(location.href);
      u.searchParams.set('v', j.v);
      location.replace(u.href);
    })
    .catch(function () {});
})();
</script>
<style>
/* оверлей: страница и холст прозрачные — OBS кладёт их поверх видео */
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
canvas { display: block; width: 100vw; height: 100vh; }
/* логотип канала — векторный рисунок поверх холста (над рамкой и окошками), щелчки не ловит */
#logo { position: absolute; left: 0; top: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<img id="logo" alt="" hidden>
<script type="module">
// ключи — из адреса (?demo → --demo)
import { boot } from './wcg.js';
import { loadSettings, createBus, logoOf, frameInset } from './kit.js';
const q = new URLSearchParams(location.search);
const args = [...q].map(([k, v]) => v === '' ? '--' + k : '--' + k + '=' + v);
// maxDpr 1: в OBS источник и так рисуется в своём размере (1920×1080), лишние точки — лишняя работа видеокарте
const { rt } = await boot({ canvas: document.getElementById('game'), maxDpr: 1, args, files: 'game/files.txt', alpha: true });

// настройки — из док-панели (dock.html): сохранённые сразу при запуске, изменения — по мере того, как их двигают.
// ?pos= в адресе источника важнее панели — на случай, если источников несколько и у каждого своё место
const B = (await rt.getAssemblyExports('KitWeb.dll')).KitWeb.Bridge;
// шрифты на выбор — не в списке запуска: файлы выбранных докладываются в файловую систему .NET перед настройками (Fonts.cs берёт
// их оттуда при первом обращении); основной (noto) — уже там
const fontsIn = new Set(['noto']);
async function ensureFonts(s) {
  const ids = new Set();
  for (const part of ['follow', 'announce', 'goal']) for (const k of ['head', 'font']) if (s[part]?.look?.[k]) ids.add(s[part].look[k]);
  await Promise.all([...ids].filter((id) => !fontsIn.has(id) && /^[a-z0-9_-]+$/.test(id)).map(async (id) => {
    try {
      const got = await Promise.all(['font.bin', 'font.png'].map(async (f) => {
        const r = await fetch(`game/data/fonts/${id}/${f}`, { cache: 'no-cache' });
        if (!r.ok) throw new Error(r.status);
        return new Uint8Array(await r.arrayBuffer());
      }));
      rt.Module.FS_createPath('/', `data/fonts/${id}`, true, true);
      ['font.bin', 'font.png'].forEach((f, i) => rt.Module.FS_createDataFile(`/data/fonts/${id}`, f, got[i], true, true, true));
      fontsIn.add(id);
    } catch (e) {
      console.warn('шрифт не загрузился:', id, e);
    }
  }));
}
// настройки — по очереди: пока качается шрифт, следующие ждут, чтобы старые не легли поверх новых
let chain = Promise.resolve();
const settle = (s) => (chain = chain.then(() => ensureFonts(s)).then(() => apply(s)));
// логотип: место из девяти (как у окошек), ширина и сдвиг — точки при высоте 1080, по размеру окна; при рамке эфира — внутри
// выреза, вплотную к линии (Layout.Place)
let logo = null, frame = null;
function placeLogo() {
  const el = document.getElementById('logo');
  if (!logo?.on) { el.hidden = true; return; }
  const [id, , lw, lh] = logoOf(logo.file);
  const u = innerHeight / 1080, w = (logo.size ?? 400) * u, h = (w * lh) / lw, pos = logo.pos || 'br';
  const ax = pos.includes('l') ? 0 : pos.includes('r') ? 1 : 0.5, ay = pos.includes('t') ? 0 : pos.includes('b') ? 1 : 0.5;
  const m = frameInset(frame) * u;
  if (!el.src.endsWith(`logos/${id}.svg`)) el.src = `logos/${id}.svg`;
  el.style.width = `${w}px`;
  el.style.height = `${h}px`;
  el.style.left = `${m + ax * (innerWidth - 2 * m - w) + (logo.dx ?? 0) * u}px`;
  el.style.top = `${m + ay * (innerHeight - 2 * m - h) + (logo.dy ?? 0) * u}px`;
  el.style.opacity = (logo.opacity ?? 100) / 100;
  el.hidden = false;
}
addEventListener('resize', placeLogo);
const apply = (s) => {
  if (s.frame) frame = s.frame;
  if (s.logo || s.frame) { logo = s.logo ?? logo; placeLogo(); }
  if (s.follow) B.Follow(s.follow.on, q.get('pos') || s.follow.pos, s.follow.title, s.follow.seconds);
  if (s.follow) B.FollowSize(s.follow.pad ?? 70, (s.follow.sx ?? 100) / 100, (s.follow.sy ?? 100) / 100, s.follow.inner ?? 1);
  if (s.goal) B.GoalSize(s.goal.pad ?? 50, (s.goal.sx ?? 100) / 100, (s.goal.sy ?? 100) / 100, s.goal.inner ?? 1);
  if (s.announce) {
    // анонсов несколько, у каждого свой вывод и таймер — живут в доке и присылают карточку со своим заголовком (bus 'card');
    // окошко здесь общее: место, заголовок по умолчанию, время
    B.Announce(true, s.announce.pos, s.announce.title, s.announce.seconds);
    B.AnnounceSize(s.announce.pad ?? 70, (s.announce.sx ?? 100) / 100, (s.announce.sy ?? 100) / 100, s.announce.inner ?? 1);
  }
  // оформление: размер частиц в доке — проценты, в показе — доля
  for (const part of ['follow', 'announce', 'goal'])
    if (s[part]?.look) B.Style(part, JSON.stringify({ ...s[part].look, fx: { ...s[part].look.fx, size: (s[part].look.fx?.size ?? 100) / 100 } }));
  if (s.frame) B.Frame(JSON.stringify(s.frame));
  if (s.goal) B.Goal(s.goal.on, s.goal.pos, s.goal.title, s.goal.current, s.goal.target, s.goal.style || 'ltr');
};
settle(loadSettings());
const bus = createBus((msg) => {
  if (msg.type === 'settings') settle(msg.settings);
  else if (msg.type === 'alert' && msg.kind === 'follow') B.ShowFollow(msg.name);
  else if (msg.type === 'alert' && msg.kind === 'announce') B.ShowAnnounce(msg.name);
  else if (msg.type === 'card') B.ShowCard(msg.title || '', msg.text);
  else if (msg.type === 'goalTest') B.PreviewGoal(msg.frac);
  else if (msg.type === 'ping') bus.send('pong', { page: 'alerts' });
});
</script>
</body>
</html>
