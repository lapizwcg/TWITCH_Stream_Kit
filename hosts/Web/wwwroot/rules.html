<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albion: Solo Leveling</title>
<meta name="description" content="Albion Online challenge «Solo Leveling» by LapizWCG: rules in many languages">
<!-- ПРАВИЛА ЧЕЛЛЕНДЖА для зрителей на многих языках. Тексты — rules/<код>.json (ru — исходник, копия документа правил в Claude Docs;
     остальные — переводы с той же структурой). Язык: ?lang= в адресе, затем выбранный раньше (localStorage), затем язык браузера,
     иначе английский -->
<style>
:root {
  --bg: #0f1116; --panel: #181b22; --line: #2b2f3a; --text: #e6e8ec; --muted: #9aa0ab;
  --gold: #e9b95a; --blue: #3b82d6; --ok: #3fb26b; --bad: #e0605a;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 'Segoe UI', system-ui, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 16px 16px 64px; }
.lang { display: flex; justify-content: flex-end; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.lang select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; }
header { text-align: center; padding: 8px 0 20px; }
header img { width: min(420px, 100%); height: auto; }
h1 { margin: 12px 0 4px; font-size: clamp(24px, 5vw, 34px); letter-spacing: .02em; }
h1 span { color: var(--gold); }
.lead { margin: 0 auto; max-width: 640px; color: var(--muted); }
h2 { margin: 40px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 22px; }
h3 { margin: 18px 0 6px; font-size: 16px; }
p { margin: 8px 0; }
ul { margin: 6px 0; padding-left: 22px; }
li { margin: 3px 0; }
.note { padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 8px; background: var(--panel); }
.principles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 12px 0; padding: 0; list-style: none; }
.principles li { margin: 0; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.principles b { display: block; margin-bottom: 4px; color: var(--gold); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.box { padding: 6px 14px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.box h3 { margin-top: 8px; }
.yes h3 { color: var(--ok); }
.no h3 { color: var(--bad); }
footer { margin-top: 48px; color: var(--muted); font-size: 14px; text-align: center; }
a { color: var(--gold); }
</style>
</head>
<body>
<main>
  <div class="lang"><label for="lang" id="langLabel">Language</label><select id="lang"></select></div>
  <header>
    <img src="logos/plaque_blue.svg" alt="LapizWCG — Albion Online">
    <h1 id="title">Albion: <span>Solo Leveling</span></h1>
    <p class="lead" id="lead"></p>
  </header>
  <p class="note" id="note"></p>
  <div id="rules"></div>
  <footer id="footer"></footer>
</main>
<script>
// языки: код файла rules/<код>.json и название на самом языке; порядок — в списке выбора
var LANGS = [
  ['en', 'English'], ['ru', 'Русский'], ['uk', 'Українська'], ['es', 'Español'], ['pt', 'Português'], ['de', 'Deutsch'],
  ['fr', 'Français'], ['it', 'Italiano'], ['pl', 'Polski'], ['tr', 'Türkçe'], ['zh', '简体中文'], ['ko', '한국어'], ['ja', '日本語'],
];
var TWITCH = 'https://www.twitch.tv/lapizwcg';
var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
// {twitch} и {channel} — ссылка на канал
var links = function (s) {
  return esc(s).replace('{twitch}', '<a href="' + TWITCH + '">twitch.tv/lapizwcg</a>').replace('{channel}', '<a href="' + TWITCH + '">LapizWCG</a>');
};
var ul = function (items, cls) { return '<ul' + (cls ? ' class="' + cls + '"' : '') + '>' + items.map(function (t) { return '<li>' + links(t) + '</li>'; }).join('') + '</ul>'; };

function render(t) {
  document.documentElement.lang = t.code;
  document.title = t.pageTitle;
  document.getElementById('langLabel').textContent = t.language;
  document.getElementById('title').innerHTML = esc(t.title.pre) + '<span>' + esc(t.title.accent) + '</span>' + esc(t.title.post || '');
  document.getElementById('lead').textContent = t.lead;
  document.getElementById('note').textContent = t.note;
  document.getElementById('footer').innerHTML = links(t.footer);
  document.getElementById('rules').innerHTML = t.sections.map(function (s) {
    var h = s.h ? '<h2>' + esc(s.h) + '</h2>' : '<h3>' + esc(s.h3) + '</h3>';
    var p = (s.p || []).map(function (x) { return '<p>' + links(x) + '</p>'; }).join('');
    var body = '';
    if (s.ul) body += ul(s.ul);
    if (s.principles) body += '<ul class="principles">' + s.principles.map(function (x) { return '<li><b>' + esc(x[0]) + '</b>' + esc(x[1]) + '</li>'; }).join('') + '</ul>';
    if (s.cols) body += '<div class="cols">' + s.cols.map(function (c) {
      return '<div class="box ' + c.kind + '"><h3>' + esc(c.h) + '</h3>' + ul(c.ul) + (c.p ? '<p>' + links(c.p) + '</p>' : '') + '</div>';
    }).join('') + '</div>';
    return h + p + body;
  }).join('');
}

function load(code) {
  fetch('rules/' + code + '.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function () { if (code !== 'en') load('en'); });
}

// язык: ?lang= → выбранный раньше → язык браузера → английский
function pick() {
  var has = function (c) { return LANGS.some(function (l) { return l[0] === c; }); };
  var q = new URLSearchParams(location.search).get('lang');
  if (q && has(q)) return q;
  try { var saved = localStorage.getItem('rules.lang'); if (saved && has(saved)) return saved; } catch (e) {}
  var nav = navigator.languages || [navigator.language || 'en'];
  for (var i = 0; i < nav.length; i++) { var c = String(nav[i]).toLowerCase().split('-')[0]; if (has(c)) return c; }
  return 'en';
}

var sel = document.getElementById('lang');
sel.innerHTML = LANGS.map(function (l) { return '<option value="' + l[0] + '">' + l[1] + '</option>'; }).join('');
sel.value = pick();
sel.onchange = function () {
  try { localStorage.setItem('rules.lang', sel.value); } catch (e) {}
  var u = new URL(location.href);
  u.searchParams.set('lang', sel.value);
  history.replaceState(null, '', u.href);
  load(sel.value);
};
load(sel.value);
</script>
</body>
</html>
